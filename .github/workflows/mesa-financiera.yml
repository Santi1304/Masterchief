# Mesa Financiera en la nube: funciona con tu computadora apagada.
#  · CRON PERSONALIZADO: cada 15 minutos de lunes a viernes, de 07:00 a 15:45 hora de CDMX
#    (13:00-21:45 UTC), que cubre la sesión de la bolsa de Nueva York (9:30-16:00 hora de NY).
#    Fuera de ese horario los precios no cambian, así que revisar cada 10 min las 24 h gastaba
#    ~144 ejecuciones al día; ahora son 36 en días hábiles (9 h × 4) y 1 al día el fin de semana.
#  · Sábado y domingo revisa una vez (09:07 CDMX) para no perder mensajes: Telegram los guarda solo 24 h.
#  · También puedes lanzarlo a mano (incluso desde la app de GitHub en tu celular):
#    Actions → mesa-financiera → Run workflow → escribe el ticker.
name: mesa-financiera

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"    # hora UTC; GitHub puede retrasar unos minutos las ejecuciones
    - cron: "7 15 * * 0,6"          # fin de semana: 1 revisión al día (09:07 CDMX)
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker a analizar (déjalo vacío para solo revisar Telegram)"
        required: false
        default: "AAPL"
      simulacion:
        description: "Modo simulación (sin gastar llaves)"
        type: boolean
        default: false

concurrency:                        # evita dos ejecuciones al mismo tiempo
  group: mesa-financiera
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mesa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MODO_SIMULACION: ${{ inputs.simulacion && '1' || '0' }}
      TICKER: ${{ inputs.ticker }}  # se pasa como variable, nunca se pega dentro del comando
    steps:
      # [SEGURIDAD] Acciones fijadas por SHA (inmutable) y no por etiqueta (una etiqueta se puede mover).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # [SEGURIDAD] no deja el token de GitHub guardado en el disco
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analizar el ticker indicado a mano
        if: github.event_name == 'workflow_dispatch' && env.TICKER != ''
        run: python analizar.py "$TICKER" --telegram

      - name: Revisar mensajes pendientes en Telegram
        run: python revisar_telegram.py

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: evidencias-${{ github.run_number }}
          path: salidas/
          if-no-files-found: ignore
          retention-days: 14
