# Pruebas automáticas en modo simulación: no usan llaves ni gastan cuota.
# Se ejecutan cada vez que subes cambios; si algo se rompe, verás una ❌ en la pestaña Actions.
name: pruebas

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODO_SIMULACION: "1"
    steps:
      # [SEGURIDAD] Acciones fijadas por SHA (inmutable) y no por etiqueta (una etiqueta se puede mover).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # [SEGURIDAD] no deja el token de GitHub guardado en el disco
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python analizar.py AAPL --simulacion
